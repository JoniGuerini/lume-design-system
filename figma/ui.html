<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<!--
  Janela do plugin. O build (scripts/build-figma-plugin.mjs) troca os marcadores @lume:* por:
  css     as fontes do Lume embutidas (OFL 1.1) + tokens, base, botão, checkbox e controle segmentado do ds/
  version a versão do changelog
  A janela segue o tema do Figma (classe figma-light/figma-dark no <html>) com os temas claro e escuro do Lume.
-->
<style>/* @lume:css */</style>
<style>
  /* deitada: à esquerda a marca, o título e as ações; à direita as três escolhas */
  body { min-height: 0; display: grid; grid-template-columns: 250px 1fr; grid-template-rows: auto 1fr; column-gap: var(--ds-space-400); padding: var(--ds-space-300); font: var(--ds-text-body-sm); letter-spacing: var(--ds-text-body-sm-tracking); }

  .brand { display: flex; align-items: center; gap: var(--ds-space-100); }
  .brand svg { width: 22px; height: 22px; flex: none; }
  .brand__name { font: 400 24px/1 var(--ds-font-family-display); letter-spacing: -0.02em; }
  .brand__version { margin-left: auto; padding: 2px var(--ds-space-100); border: 1px solid var(--ds-color-border-default); border-radius: var(--ds-radius-full); color: var(--ds-color-fg-muted); font: var(--ds-text-caption); font-variant-numeric: tabular-nums; }

  .intro { grid-column: 1; grid-row: 1; min-width: 0; }
  .options { grid-column: 2; grid-row: 1 / 3; display: flex; flex-direction: column; gap: var(--ds-space-250); min-width: 0; }
  .footer { grid-column: 1; grid-row: 2; align-self: end; padding-top: var(--ds-space-300); }
  h1 { margin-top: var(--ds-space-300); font: var(--ds-text-heading-md); letter-spacing: var(--ds-text-heading-md-tracking); }
  .lead { margin-top: var(--ds-space-075); color: var(--ds-color-fg-muted); }

  .label { display: flex; gap: var(--ds-space-075); margin-bottom: var(--ds-space-100); color: var(--ds-color-fg-muted); font: var(--ds-text-label-sm); }
  .label span { color: var(--ds-color-fg-subtle); font-variant-numeric: tabular-nums; }
  .hint { margin-top: var(--ds-space-100); color: var(--ds-color-fg-muted); font: var(--ds-text-caption); }

  /* o que gerar: uma lista com linhas, não três caixas */
  .choices { border: 1px solid var(--ds-color-border-subtle); border-radius: var(--ds-radius-lg); background: var(--ds-color-bg-surface); }
  .choices .ds-checkbox { display: flex; padding: var(--ds-space-150) var(--ds-space-200); }
  .choices .ds-choice__label { font: var(--ds-text-label-md); }
  .choices .ds-choice__description { font: var(--ds-text-body-sm); }
  .choices .ds-checkbox + .ds-checkbox { border-top: 1px solid var(--ds-color-border-subtle); }

  .ds-segmented { display: flex; }
  .ds-segmented__item { flex: 1; height: var(--ds-size-control-sm); font: var(--ds-text-label-sm); }

  .actions { display: flex; flex-direction: column; gap: var(--ds-space-100); }
  .actions .ds-btn { width: 100%; }
  .actions .ds-btn:disabled { opacity: var(--ds-opacity-disabled); cursor: default; }

  .status { display: flex; gap: var(--ds-space-100); align-items: baseline; margin-top: var(--ds-space-200); padding: var(--ds-space-150) var(--ds-space-200); border-radius: var(--ds-radius-lg); background: var(--ds-color-bg-sunken); color: var(--ds-color-fg-muted); font: var(--ds-text-caption); }
  .status::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: var(--ds-radius-full); background: var(--ds-color-fg-subtle); transform: translateY(-1px); }
  .status[data-tone="busy"]::before { background: var(--ds-color-brand-indicator); animation: pulse 1s var(--ds-easing-standard) infinite alternate; }
  .status[data-tone="done"] { color: var(--ds-color-fg-default); }
  .status[data-tone="done"]::before { background: var(--ds-color-success-solid); }
  .status[data-tone="error"] { color: var(--ds-color-danger-fg); }
  .status[data-tone="error"]::before { background: var(--ds-color-danger-solid); }
  @keyframes pulse { to { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { .status[data-tone="busy"]::before { animation: none; } }
</style>
</head>
<body>
  <div class="intro">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M12.963 2.286a.75.75 0 0 0-1.071-.136 9.742 9.742 0 0 0-3.539 6.176 7.547 7.547 0 0 1-1.705-1.715.75.75 0 0 0-1.152-.082A9 9 0 1 0 15.68 4.534a7.46 7.46 0 0 1-2.717-2.248z" fill="#c97b63"/><path d="M15.75 14.25a3.75 3.75 0 1 1-7.313-1.172c.628.465 1.35.81 2.133 1.001a5.99 5.99 0 0 1 1.925-3.546 3.75 3.75 0 0 1 3.255 3.717z" fill="#ffffff" opacity="0.28"/></svg>
    <span class="brand__name">Lume</span>
    <span class="brand__version">@lume:version</span>
  </div>

  <h1 data-t="title">Gerar a biblioteca</h1>
  <p class="lead" data-t="lead"></p>
  </div>

  <div class="options">

  <section>
    <p class="label" id="what-label"><span>01</span><b data-t="what"></b></p>
    <div class="choices" role="group" aria-labelledby="what-label">
      <label class="ds-checkbox"><input type="checkbox" class="ds-checkbox__input" value="Fundamentos" checked><span class="ds-choice__text"><span class="ds-choice__label" data-t="foundations"></span><span class="ds-choice__description" data-t="foundationsText"></span></span></label>
      <label class="ds-checkbox"><input type="checkbox" class="ds-checkbox__input" value="Ícones" checked><span class="ds-choice__text"><span class="ds-choice__label" data-t="icons"></span><span class="ds-choice__description" data-t="iconsText"></span></span></label>
      <label class="ds-checkbox"><input type="checkbox" class="ds-checkbox__input" value="Componentes" checked><span class="ds-choice__text"><span class="ds-choice__label" data-t="components"></span><span class="ds-choice__description" data-t="componentsText"></span></span></label>
    </div>
  </section>

  <section>
    <p class="label" id="modes-label"><span>02</span><b data-t="modes"></b></p>
    <div class="ds-segmented" role="radiogroup" aria-labelledby="modes-label" data-group="modes">
      <button type="button" class="ds-segmented__item" role="radio" data-value="Claro,Escuro" aria-checked="true" data-t="both"></button>
      <button type="button" class="ds-segmented__item" role="radio" data-value="Escuro" aria-checked="false" data-t="darkOnly"></button>
      <button type="button" class="ds-segmented__item" role="radio" data-value="Claro" aria-checked="false" data-t="lightOnly"></button>
    </div>
    <p class="hint" data-hint></p>
  </section>

  <section>
    <p class="label" id="locale-label"><span>03</span><b data-t="language"></b></p>
    <div class="ds-segmented" role="radiogroup" aria-labelledby="locale-label" data-group="locale">
      <button type="button" class="ds-segmented__item" role="radio" data-value="system" aria-checked="true" data-t="system"></button>
      <button type="button" class="ds-segmented__item" role="radio" data-value="pt-BR" aria-checked="false" lang="pt-BR">Português</button>
      <button type="button" class="ds-segmented__item" role="radio" data-value="en" aria-checked="false" lang="en">English</button>
      <button type="button" class="ds-segmented__item" role="radio" data-value="es" aria-checked="false" lang="es">Español</button>
    </div>
    <p class="hint" data-t="languageHint"></p>
  </section>
  </div>

  <!-- depois das escolhas na ordem do Tab; no grid, embaixo da coluna da esquerda -->
  <div class="footer">
    <div class="actions">
      <button type="button" class="ds-btn ds-btn--primary" data-run></button>
      <button type="button" class="ds-btn ds-btn--secondary" data-copy-links data-t="copyLinks" hidden></button>
      <button type="button" class="ds-btn ds-btn--secondary" data-cancel data-t="close"></button>
    </div>
    <p class="status" data-log aria-live="polite"></p>
  </div>

<script>
  // textos da janela nas três línguas; o idioma “Sistema” segue o do computador (o que não for português nem espanhol vira inglês)
  const STRINGS = {
    'pt-BR': {
      title: 'Gerar a biblioteca',
      lead: 'Cria ou atualiza variáveis, estilos e componentes neste arquivo. Rodar de novo atualiza sem duplicar, e as instâncias que você já usou continuam ligadas.',
      what: 'O que gerar',
      foundations: 'Fundamentos', foundationsText: 'Cores, tipografia, espaço, raio e sombra',
      icons: 'Ícones', iconsText: 'Todos os ícones como componentes de 24 px',
      components: 'Componentes', componentsText: 'Blocos com variantes, exemplos e prévias em cada modo',
      modes: 'Modos', both: 'Claro e Escuro', darkOnly: 'Só Escuro', lightOnly: 'Só Claro',
      bothHint: 'Precisa de plano pago no Figma: o gratuito aceita um modo só por coleção.',
      oneHint: 'Funciona em qualquer plano. Para ter os dois depois, rode de novo com Claro e Escuro: o que já existe é atualizado.',
      language: 'Idioma', system: 'Sistema',
      languageHint: 'Nomes, textos e descrições de tudo o que o plugin cria. Trocar e rodar de novo renomeia o que já existe.',
      close: 'Fechar', run: 'Gerar no arquivo', again: 'Gerar de novo', starting: 'Começando…',
      ready: 'Variáveis e estilos de texto são sempre atualizados.',
      copyLinks: 'Copiar links', copied: 'Links copiados. Cole na conversa com o Claude.',
    },
    en: {
      title: 'Generate the library',
      lead: 'Creates or updates variables, styles, and components in this file. Running again updates without duplicating, and the instances you already use stay linked.',
      what: 'What to generate',
      foundations: 'Foundations', foundationsText: 'Colors, typography, space, radius, and shadow',
      icons: 'Icons', iconsText: 'Every icon as a 24 px component',
      components: 'Components', componentsText: 'Blocks with variants, examples, and previews in each mode',
      modes: 'Modes', both: 'Light and Dark', darkOnly: 'Dark only', lightOnly: 'Light only',
      bothHint: 'Needs a paid Figma plan: the free one allows only one mode per collection.',
      oneHint: 'Works on any plan. To get both later, run again with Light and Dark: what already exists gets updated.',
      language: 'Language', system: 'System',
      languageHint: 'Names, text, and descriptions of everything the plugin creates. Switching and running again renames what already exists.',
      close: 'Close', run: 'Generate in file', again: 'Generate again', starting: 'Starting…',
      ready: 'Variables and text styles are always updated.',
      copyLinks: 'Copy links', copied: 'Links copied. Paste them in the chat with Claude.',
    },
    es: {
      title: 'Generar la biblioteca',
      lead: 'Crea o actualiza variables, estilos y componentes en este archivo. Ejecutarlo de nuevo actualiza sin duplicar, y las instancias que ya usas siguen vinculadas.',
      what: 'Qué generar',
      foundations: 'Fundamentos', foundationsText: 'Colores, tipografía, espacio, radio y sombra',
      icons: 'Íconos', iconsText: 'Todos los íconos como componentes de 24 px',
      components: 'Componentes', componentsText: 'Bloques con variantes, ejemplos y vistas previas en cada modo',
      modes: 'Modos', both: 'Claro y Oscuro', darkOnly: 'Solo Oscuro', lightOnly: 'Solo Claro',
      bothHint: 'Necesita un plan de pago en Figma: el gratuito admite un solo modo por colección.',
      oneHint: 'Funciona en cualquier plan. Para tener los dos después, ejecútalo de nuevo con Claro y Oscuro: lo que ya existe se actualiza.',
      language: 'Idioma', system: 'Sistema',
      languageHint: 'Nombres, textos y descripciones de todo lo que crea el plugin. Cambiar y ejecutar de nuevo renombra lo que ya existe.',
      close: 'Cerrar', run: 'Generar en el archivo', again: 'Generar de nuevo', starting: 'Empezando…',
      ready: 'Las variables y los estilos de texto siempre se actualizan.',
      copyLinks: 'Copiar enlaces', copied: 'Enlaces copiados. Pégalos en la conversación con Claude.',
    },
  };

  // tema: o do Figma (themeColors põe figma-light ou figma-dark no <html>)
  const root = document.documentElement;
  const syncTheme = () => { root.dataset.theme = root.classList.contains('figma-light') ? 'light' : 'dark'; };
  syncTheme();
  new MutationObserver(syncTheme).observe(root, { attributes: true, attributeFilter: ['class'] });

  // controle segmentado do Lume: rádios com Tab único e setas
  const group = (name) => document.querySelector(`[data-group="${name}"]`);
  const items = (name) => [...group(name).querySelectorAll('[role="radio"]')];
  const value = (name) => items(name).find((i) => i.getAttribute('aria-checked') === 'true').dataset.value;
  const select = (name, val) => {
    items(name).forEach((i) => {
      const on = i.dataset.value === val;
      i.setAttribute('aria-checked', String(on));
      i.tabIndex = on ? 0 : -1;
    });
  };
  const onSelect = {};
  ['modes', 'locale'].forEach((name) => {
    select(name, value(name));
    group(name).addEventListener('click', (e) => {
      const item = e.target.closest('[role="radio"]');
      if (!item) return;
      select(name, item.dataset.value);
      onSelect[name]();
    });
    group(name).addEventListener('keydown', (e) => {
      const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
      if (!step) return;
      e.preventDefault();
      const list = items(name);
      const next = list[(list.findIndex((i) => i.getAttribute('aria-checked') === 'true') + step + list.length) % list.length];
      select(name, next.dataset.value);
      next.focus();
      onSelect[name]();
    });
  });

  const log = document.querySelector('[data-log]');
  const run = document.querySelector('[data-run]');
  const hint = document.querySelector('[data-hint]');
  const chosenModes = () => value('modes').split(',');
  const preference = () => value('locale');
  const systemLocale = () => {
    for (const tag of navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]) {
      const t = String(tag).toLowerCase();
      if (t.startsWith('pt')) return 'pt-BR';
      if (t.startsWith('es')) return 'es';
      if (t.startsWith('en')) return 'en';
    }
    return 'en';
  };
  const locale = () => (preference() === 'system' ? systemLocale() : preference());
  const s = () => STRINGS[locale()];
  let ran = false;
  let idle = true; // o status mostra a frase de espera até a primeira mensagem do plugin

  // pede ao Figma a altura do conteúdo, para a janela não sobrar nem rolar
  const fit = () => requestAnimationFrame(() => parent.postMessage({ pluginMessage: { type: 'resize', width: 760, height: document.body.scrollHeight } }, '*'));
  const showHint = () => {
    hint.textContent = chosenModes().length > 1 ? s().bothHint : s().oneHint;
  };
  const apply = () => {
    root.lang = locale();
    document.querySelectorAll('[data-t]').forEach((el) => (el.textContent = s()[el.dataset.t]));
    run.textContent = ran ? s().again : s().run;
    if (idle) log.textContent = s().ready;
    showHint();
    fit();
  };
  onSelect.modes = () => { showHint(); fit(); };
  onSelect.locale = () => {
    apply();
    parent.postMessage({ pluginMessage: { type: 'locale', preference: preference() } }, '*');
  };
  apply();

  run.addEventListener('click', () => {
    const pages = [...document.querySelectorAll('input[type="checkbox"]:checked')].map((i) => i.value);
    run.disabled = true;
    idle = false;
    log.dataset.tone = 'busy';
    log.textContent = s().starting;
    parent.postMessage({ pluginMessage: { type: 'run', pages, modes: chosenModes(), locale: locale() } }, '*');
  });
  // links dos blocos para o site: o iframe do plugin não tem navigator.clipboard, então vai por execCommand
  const copyLinks = document.querySelector('[data-copy-links]');
  let links = '';
  copyLinks.addEventListener('click', () => {
    const area = document.createElement('textarea');
    area.value = links;
    document.body.append(area);
    area.select();
    document.execCommand('copy');
    area.remove();
    log.dataset.tone = 'done';
    log.textContent = s().copied;
  });
  document.querySelector('[data-cancel]').addEventListener('click', () => parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*'));
  onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg || msg.type === 'resize') return; // fora do Figma, o pedido de altura volta para a própria janela
    if (msg.type === 'init') {
      if (msg.modes && items('modes').some((i) => i.dataset.value === msg.modes.join(','))) select('modes', msg.modes.join(','));
      if (items('locale').some((i) => i.dataset.value === msg.locale)) select('locale', msg.locale);
      apply();
      return;
    }
    idle = false;
    log.textContent = msg.message;
    log.dataset.tone = msg.type === 'done' || msg.type === 'error' ? msg.type : 'busy';
    if (msg.type === 'done' || msg.type === 'error') {
      run.disabled = false;
      ran = true;
      run.textContent = s().again;
      links = msg.links || '';
      copyLinks.hidden = !links;
      fit();
    }
  };
</script>
</body>
</html>
