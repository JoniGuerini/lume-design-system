name: Bug
description: Something doesn't work or looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for letting us know! You can write in English, Portuguese or Spanish."
  - type: input
    id: where
    attributes:
      label: Where it happens
      description: The lumeui.dev page or the component
      placeholder: "https://lumeui.dev/#/componentes/selecao"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected and what happened. A screenshot helps a lot.
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options: [Light, Dark, Both]
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "Chrome 142 on Windows 11"
  - type: dropdown
    id: usage
    attributes:
      label: How you use Lume
      options: [Only on the lumeui.dev site, HTML and JavaScript, React, npm package]
