    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <!-- prévia de link (X, LinkedIn, WhatsApp…): estático e em inglês, porque esses robôs não rodam JavaScript -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lume Design System" />
    <meta property="og:title" content="Lume Design System" />
    <meta property="og:description" content="Open design system: tokens, components, charts and screen patterns in plain HTML, CSS and JavaScript, with React." />
    <meta property="og:url" content="https://lumeui.dev/" />
    <meta property="og:image" content="https://lumeui.dev/assets/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:title" content="Lume Design System" />
    <meta name="twitter:description" content="Open design system: tokens, components, charts and screen patterns in plain HTML, CSS and JavaScript, with React." />

    <link rel="preload" href="ds/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="ds/fonts/GeistSerif-Regular.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      // aplica tema, idioma, barra de rolagem e estado da sidebar antes do primeiro paint (sem "piscar")
      document.documentElement.setAttribute('data-ds-scrollbars', '');
      try {
        // tema: light ou dark; sem escolha salva, segue o sistema (a mesma conta de ds/js/theme.js)
        var t = localStorage.getItem('ds-theme');
        if (!localStorage.getItem('ds-theme-v')) t = t === 'refugio' ? 'light' : t === 'light' ? null : t;
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
      try {
        var l = null;
        try { l = localStorage.getItem('ds-locale'); } catch (e) {}
        if (l !== 'pt-BR' && l !== 'en' && l !== 'es') {
          l = 'en';
          var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
          for (var i = 0; i < langs.length; i++) {
            var x = String(langs[i]).toLowerCase();
            if (x.indexOf('pt') === 0) { l = 'pt-BR'; break; }
            if (x.indexOf('es') === 0) { l = 'es'; break; }
            if (x.indexOf('en') === 0) { l = 'en'; break; }
          }
        }
        document.documentElement.lang = l;
      } catch (e) {}
    </script>

    <script>
      // visitas (Vercel Web Analytics): só no site publicado e fora dos exemplos em iframe, que contariam como visita
      if (location.hostname === 'lumeui.dev' && !new URLSearchParams(location.search).has('embed')) {
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
        var insights = document.createElement('script');
        insights.defer = true;
        insights.src = '/_vercel/insights/script.js';
        insights.dataset.disableAutoTrack = '1'; // o site manda cada página (site/app.js), já que navega por #
        document.head.append(insights);
      }
    </script>

    <link rel="stylesheet" href="ds/ds.css" />
    <link rel="stylesheet" href="site/site.css" />
    <link rel="stylesheet" href="site/docs.css" />
    <script type="module" src="site/app.js"></script>
  </head>

          var s = JSON.parse(localStorage.getItem('ds-sidebar'));

          if (ly === 'navbar' || ly === 'sidebar') document.getElementById('shell').dataset.layout = ly;
        } catch (e) {}
